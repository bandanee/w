name: Build APK
on:
  workflow_dispatch:
    inputs:
      html:
        description: "Paketlenecek HTML dosyasi (depo kokundeki ad, orn. 303345...324.html)"
        required: true
      appname:
        description: "Uygulama adi"
        required: false
        default: "Web Uygulamasi"
      appid:
        description: "Paket kimligi (reverse-DNS)"
        required: false
        default: "com.okankaplanedu.webapp"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Android projesi üret + APK derle
        env:
          SRC: ${{ github.event.inputs.html }}
          APP: ${{ github.event.inputs.appname }}
          PKG: ${{ github.event.inputs.appid }}
        run: |
          # CI'da koşacak android-projesi üretici (GitHub Actions run bloğunun aynısı)
          set -e
          SRC="${SRC:-index.html}"
          APP="${APP:-My App}"
          PKG="${PKG:-com.okankaplanedu.webapp}"
          PKGPATH=$(echo "$PKG" | tr '.' '/')
          rm -rf android && mkdir -p "android/app/src/main/assets/www" "android/app/src/main/java/$PKGPATH" \
            android/app/src/main/res/values android/app/src/main/res/mipmap-xxhdpi
          cp "$SRC" android/app/src/main/assets/www/index.html

          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "webapp"
          include ':app'
          EOF
          cat > android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          printf 'org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\n' > android/gradle.properties

          cat > android/app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace '$PKG'
              compileSdk 34
              defaultConfig { applicationId "$PKG"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.7.0' }
          EOF

          cat > "android/app/src/main/AndroidManifest.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="@string/app_name"
                  android:usesCleartextTraffic="false" android:theme="@style/Theme.App">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "android/app/src/main/java/$PKGPATH/MainActivity.java" <<EOF
          package $PKG;
          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.*;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              private WebView web;
              @SuppressLint("SetJavaScriptEnabled")
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true);
                  web.setWebViewClient(new WebViewClient()); web.setWebChromeClient(new WebChromeClient());
                  web.loadUrl("file:///android_asset/www/index.html");
                  setContentView(web);
              }
          }
          EOF

          cat > android/app/src/main/res/values/strings.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">$APP</string></resources>
          EOF
          cat > android/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><style name="Theme.App" parent="Theme.AppCompat.DayNight.NoActionBar"/></resources>
          EOF
          echo "URETILDI"

          cd android && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/**/*.apk
