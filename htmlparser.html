      color: var(--ink);
      line-height: 1.7;
      padding-bottom: 80px;
    }
    .container { width: min(980px, 95%); margin: 0 auto; }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
      color: #fff;
      padding: 50px 30px;
      border-radius: 0 0 var(--radius) var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 36px;
    }
    .hero h1 { font-size: clamp(26px, 5vw, 40px); font-weight: 900; letter-spacing: -1px; }
    .hero p  { margin-top: 12px; font-size: 17px; opacity: .9; }
    .hero .pill {
      display: inline-flex; gap: 6px; margin-top: 20px;
      background: rgba(255,255,255,.12); backdrop-filter: blur(4px);
      padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 700;
    }

    /* INSTRUCTION */
    .instruction {
      background: var(--card); border: 1px dashed #cbd5e1;
      border-radius: var(--radius); padding: 28px; margin-bottom: 36px;
      box-shadow: var(--shadow);
    }
    .instruction h2 { font-size: 20px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
    .instruction ol { padding-left: 22px; }
    .instruction li { margin-bottom: 10px; }
    .instruction strong { color: #0369a1; }
    .flow {
      margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      padding: 16px; background: #f8fafc; border-radius: 12px;
    }
    .flow-item { padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; }
    .flow-arrow { color: var(--muted); font-weight: 900; }

    /* STEP CARD */
    .step {
      background: var(--card); border-radius: var(--radius); margin-bottom: 30px;
      box-shadow: var(--shadow); overflow: hidden;
      scroll-margin-top: 24px;
    }
    .step-header {
      display: flex; align-items: center; gap: 16px;
      padding: 22px 24px;
    }
    .step-number {
      width: 52px; height: 52px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(255,255,255,.8);
      font-size: 22px; font-weight: 900;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
      flex-shrink: 0;
    }
    .step-meta { flex: 1; min-width: 0; }
    .step-title {
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
      font-size: 19px; font-weight: 800; letter-spacing: -.3px;
    }
    .step-title .icon { font-size: 22px; }
    .step-kind { font-size: 13px; font-weight: 700; opacity: .85; margin-top: 4px; text-transform: uppercase; letter-spacing: .4px; }
    .step-path {
      background: rgba(255,255,255,.65); color: var(--ink);
      padding: 7px 14px; border-radius: 999px;
      font-size: 12px; font-weight: 700; white-space: nowrap;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }

    .step-body { padding: 26px 28px 30px; }

    /* EXPLAIN GRID */
    .explain-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px;
    }
    .explain-box {
      border-radius: 14px; padding: 18px;
      border: 1px solid #e2e8f0;
    }
    .explain-box.what { background: #f0f9ff; border-color: #bae6fd; }
    .explain-box.why  { background: #f0fdf4; border-color: #bbf7d0; }
    .explain-box.how  { background: #fffbeb; border-color: #fde68a; }
    .explain-label {
      font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .5px;
      margin-bottom: 8px; color: #475569;
      display: flex; align-items: center; gap: 6px;
    }
    .explain-box.what .explain-label::before { content: '❓'; }
    .explain-box.why  .explain-label::before { content: '💡'; }
    .explain-box.how  .explain-label::before { content: '🛠️'; }
    .explain-box p { font-size: 15px; color: #334155; }
    .explain-box strong { color: #0f172a; }

    /* CODE BOX */
    .code-box {
      border: 1px solid #e2e8f0; border-radius: 14px; overflow: hidden;
      background: #0f172a;
    }
    .code-toolbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 16px; background: #1e293b; border-bottom: 1px solid #334155;
    }
    .code-label { color: #94a3b8; font-size: 13px; font-weight: 800; letter-spacing: .3px; }
    .copy-btn {
      background: #2563eb; color: #fff; border: 0; border-radius: 8px;
      padding: 6px 14px; font-size: 13px; font-weight: 800; cursor: pointer;
      transition: background .2s;
    }
    .copy-btn:hover { background: #1d4ed8; }
    pre {
      margin: 0; padding: 18px 22px;
      overflow-x: auto;
      background: #0f172a;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px; line-height: 1.6;
      color: #e2e8f0;

    }
    .line { display: block; counter-increment: line; }
    .line::before {

      font-size: 14px; font-weight: 700;
      display: flex; align-items: center; gap: 10px;
    }
    .next-hint a { color: #2563eb; text-decoration: none; }
    .next-hint a:hover { text-decoration: underline; }
    .next-hint.finish { background: #dcfce7; color: #14532d; }

    /* FOOTER */
    .footer {
      text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px;
    }

    /* TOP BAR */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(243,244,246,.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 0;

    .topbar-btns { display: flex; gap: 10px; }

      .step-path { margin-left: 68px; }
      .explain-grid { grid-template-columns: 1fr; }
      .flow { font-size: 12px; }
    }
