<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
 
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 10px; }
    textarea { width: 100%; height: 160px; font-family: monospace; margin-top: 8px; }
    label { font-weight: bold; margin-top: 20px; display: block; }
    button { margin-top: 12px; padding: 10px 20px; cursor: pointer; }

    /* Cropper container ve görüntü ayarları */
    #cropperContainer {
      max-width: 100%;
      max-height: 400px;
      margin-top: 12px;
      display: none;
      border: 1px solid #ccc;
      position: relative;
    }
    #cropperImage {
      max-width: 100%;
      display: block;
      margin: 0 auto;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>

  <!-- Cropper.js CSS -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"
    rel="stylesheet"
  />

  <!-- jsPDF ve pdf.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.9.179/pdf.min.js"></script>
</head>
<body>

 
  <section>
   
    <input type="file" id="imageInput" accept="image/*" />
    <div id="cropperContainer">
      <img id="cropperImage" alt="Kırpma için resim" />
      <button id="cropButton" style="margin-top: 8px;">Kırp ve Kaydet</button>
    </div>
  </section>

  <hr />

  <section>
  
    <input type="file" id="htmlFile" accept=".html,.txt" />
    <textarea id="htmlContent" readonly placeholder="HTML içeriği buraya gelecek..."></textarea>
    <textarea id="asciiContent" readonly style="display:none"></textarea>
    <button id="downloadPdfBtn" disabled>ASCII Kodlarını PDF Olarak İndir</button>
  </section>

  <hr />

  <section>
    
    <input type="file" id="asciiPdfFile" accept="application/pdf" />
    <button id="processPdfBtn" disabled>PDF'den ASCII Kodlarını Oku ve HTML'ye Çevir</button>
    <textarea id="decodedHtml" readonly placeholder="Dönüştürülmüş HTML buraya gelecek..."></textarea>
    <button id="downloadHtmlBtn" disabled>HTML Kodlarını HTML Dosyası Olarak İndir</button>
  </section>

  <!-- Cropper.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>
const { jsPDF } = window.jspdf;

const htmlFile = document.getElementById('htmlFile');
const htmlContent = document.getElementById('htmlContent');
const asciiContent = document.getElementById('asciiContent');
const downloadPdfBtn = document.getElementById('downloadPdfBtn');

const asciiPdfFile = document.getElementById('asciiPdfFile');
const processPdfBtn = document.getElementById('processPdfBtn');
const decodedHtml = document.getElementById('decodedHtml');
const downloadHtmlBtn = document.getElementById('downloadHtmlBtn');

const imageInput = document.getElementById('imageInput');
const cropperContainer = document.getElementById('cropperContainer');
const cropperImage = document.getElementById('cropperImage');
const cropButton = document.getElementById('cropButton');

let cropper = null;
let bgImgData = ''; // kırpılmış base64 resim
let bgImgType = 'PNG';

// Resim seçilince cropper'ı başlat
imageInput.addEventListener('change', () => {
  const file = imageInput.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    cropperImage.src = e.target.result;
    cropperContainer.style.display = 'block';

    // Cropper varsa yok et
    if (cropper) {
      cropper.destroy();
      cropper = null;
    }

    cropper = new Cropper(cropperImage, {
      aspectRatio: NaN, // serbest oran
      viewMode: 1,
      autoCropArea: 1,
      responsive: true,
      background: false,
    });

    bgImgType = file.type.split('/')[1].toUpperCase();
  };
  reader.readAsDataURL(file);
});

// Kırp ve bgImgData olarak ata
cropButton.addEventListener('click', () => {
  if (!cropper) return alert('Önce bir resmi seçip kırpma yapın.');

  const canvas = cropper.getCroppedCanvas();
  if (!canvas) return alert('Kırpılmış canvas alınamadı.');

  bgImgData = canvas.toDataURL('image/' + bgImgType.toLowerCase());
  alert('Resim kırpıldı ve arka plan olarak kaydedildi.');
  cropperContainer.style.display = 'none';

  cropper.destroy();
  cropper = null;
});

// HTML dosyası seçilince ASCII'ye çevir
htmlFile.addEventListener('change', () => {
  const file = htmlFile.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    htmlContent.value = text;
    asciiContent.value = convertToAscii(text);
    downloadPdfBtn.disabled = false;
  };
  reader.readAsText(file);
});

 
downloadPdfBtn.addEventListener('click', () => {
  const asciiText = asciiContent.value;
  if (!asciiText) return alert('Önce bir HTML dosyası seçin.');
  if (!bgImgData) return alert('Lütfen önce bir arka plan resmi seçip kırpın.');

  const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
  const margin = 10;
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const maxLineLength = Math.floor((pageWidth - margin * 2) / 6);

  const lines = splitTextToLines(asciiText, maxLineLength);

 
  pdf.addImage(bgImgData, bgImgType, 0, 0, pageWidth, pageHeight);

  pdf.setFontSize(0.5);
  pdf.setTextColor(255, 255, 255);
 pdf.setGState(new pdf.GState({ opacity: 0 }));  

  let y = margin;
  lines.forEach(line => {
    if (y > pageHeight - margin) {
      pdf.addPage();
      pdf.addImage(bgImgData, bgImgType, 0, 0, pageWidth, pageHeight);
      y = margin;
    }
    pdf.text(line, margin, y);
    y += 0.5;
  });
  
 
pdf.setProperties({
  title: "Editable & Convertable Frontend Development Bootcamp",
  author: "Okan Kaplan",
  subject: "A Practical Browser-Based Learning Journey in HTML, CSS, and JavaScript with Real-Time Editable Projects and PDF-to-HTML",
  keywords: "HTML, CSS, JavaScript, Frontend Development, Bootcamp, Real-Time Editing, PDF to HTML, Web Development, Programming, Learning",
  creator: "livehtml.net",
  producer: "livehtml",
  creationDate: new Date("2025-06-17T03:15:08"),
});

  pdf.save('livehtml_course.pdf');
});

 
asciiPdfFile.addEventListener('change', () => {
  processPdfBtn.disabled = asciiPdfFile.files.length === 0;
});

 
processPdfBtn.addEventListener('click', () => {
  const file = asciiPdfFile.files[0];
  if (!file) return alert('PDF dosyası seçilmedi.');

  const reader = new FileReader();
  reader.onload = function () {
    const typedArray = new Uint8Array(this.result);
    pdfjsLib.getDocument(typedArray).promise.then(pdf => {
      const pagePromises = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        pagePromises.push(
          pdf.getPage(i).then(page =>
            page.getTextContent().then(textContent =>
              textContent.items.map(item => item.str).join('')
            )
          )
        );
      }

      Promise.all(pagePromises).then(pages => {
 
        const fullText = pages.join('').replace(/\s+/g, '');
        asciiContent.value = fullText;
        const html = convertAsciiToText(fullText);
        decodedHtml.value = html;
        downloadHtmlBtn.disabled = false;
      }).catch(err => alert('PDF okunamadı: ' + err.message));
    }).catch(err => alert('PDF yüklenemedi: ' + err.message));
  };

  reader.readAsArrayBuffer(file);
});

 
function convertToAscii(text) {
  return Array.from(text).map(c =>
    c.charCodeAt(0).toString().padStart(8, '0')
  ).join('');
}

 
function convertAsciiToText(ascii) {
  let res = '';
  for (let i = 0; i < ascii.length; i += 8) {
    const code = parseInt(ascii.slice(i, i + 8), 10);
    if (!isNaN(code)) res += String.fromCharCode(code);
  }
  return res;
}

 
function splitTextToLines(text, maxLength) {
  const lines = [];
  for (let i = 0; i < text.length; i += maxLength) {
    lines.push(text.slice(i, i + maxLength));
  }
  return lines;
}

 
downloadHtmlBtn.addEventListener('click', () => {
  const htmlText = decodedHtml.value;
  if (!htmlText) return alert('HTML verisi yok.');
  downloadFile(htmlText, 'converted.html', 'text/html');
});

 
function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
