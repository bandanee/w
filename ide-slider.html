<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-IDE // OKAN KAPLAN</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #FFDE00;
            --pink: #FF00F5;
            --blue: #00E0FF;
            --green: #00FF66;
            --black: #000000;
            --white: #FFFFFF;
            --border: 3px solid #000;
            --shadow: 6px 6px 0px #000;
            --shadow-sm: 3px 3px 0px #000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--white);
            color: var(--black);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- NAVBAR --- */
        nav {
            display: flex;
            align-items: center;
            padding: 1rem;
            background: var(--yellow);
            border-bottom: var(--border);
            gap: 1rem;
            z-index: 10;
        }

        .brand { font-size: 1.5rem; text-transform: uppercase; letter-spacing: -1px; }

        .nav-controls { display: flex; gap: 0.5rem; flex-grow: 1; }

        /* --- BUTTONS --- */
        button, .file-label {
            padding: 0.5rem 1rem;
            font-family: inherit;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            border: var(--border);
            box-shadow: var(--shadow-sm);
            transition: all 0.1s ease;
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:active, .file-label:active { transform: translate(2px, 2px); box-shadow: none; }
        
        .btn-green { background: var(--green); }
        .btn-blue { background: var(--blue); }
        .btn-pink { background: var(--pink); }

        input#fileName {
            border: var(--border);
            padding: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            width: 150px;
            outline: none;
        }

        /* --- MAIN WORKSPACE --- */
        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex-grow: 1;
            background: var(--black);
            gap: 3px;
        }

        .pane { background: var(--white); display: flex; flex-direction: column; height: 100%; }

        /* --- TABS --- */
        .tabs {
            display: flex;
            background: var(--white);
            border-bottom: var(--border);
        }

        .tab-btn {
            flex: 1;
            border: none;
            border-right: var(--border);
            box-shadow: none;
            background: var(--white);
            padding: 0.75rem;
        }

        .tab-btn.active { background: var(--black); color: var(--white); }

        /* --- EDITOR --- */
        .editor-box { flex-grow: 1; position: relative; }
        
        textarea {
            width: 100%;
            height: 100%;
            border: none;
            padding: 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            outline: none;
            resize: none;
            background: transparent;
        }

        /* --- PREVIEW --- */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* --- MODAL --- */
        #helpModal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            background: var(--white);
            border: var(--border);
            box-shadow: 15px 15px 0px var(--black);
            z-index: 100;
            display: none;
            flex-direction: column;
        }

        .modal-header {
            padding: 1rem;
            background: var(--black);
            color: var(--white);
            display: flex;
            justify-content: space-between;
        }

        /* Layout Classes */
        .layout-editor main { grid-template-columns: 1fr 0px; }
        .layout-preview main { grid-template-columns: 0px 1fr; }

        @media (max-width: 768px) {
            main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        }
    </style>
</head>
<body>

<nav>
    <div class="brand">Okan Kaplan</div>
    <div class="nav-controls">
        <label for="fileInput" class="file-label btn-blue"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="currentColor" class="bi bi-folder2-open" viewBox="0 0 16 16">
  <path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h2.764c.958 0 1.76.56 2.311 1.184C7.985 3.648 8.48 4 9 4h4.5A1.5 1.5 0 0 1 15 5.5v.64c.57.265.94.876.856 1.546l-.64 5.124A2.5 2.5 0 0 1 12.733 15H3.266a2.5 2.5 0 0 1-2.481-2.19l-.64-5.124A1.5 1.5 0 0 1 1 6.14zM2 6h12v-.5a.5.5 0 0 0-.5-.5H9c-.964 0-1.71-.629-2.174-1.154C6.374 3.334 5.82 3 5.264 3H2.5a.5.5 0 0 0-.5.5zm-.367 1a.5.5 0 0 0-.496.562l.64 5.124A1.5 1.5 0 0 0 3.266 14h9.468a1.5 1.5 0 0 0 1.489-1.314l.64-5.124A.5.5 0 0 0 14.367 7z"/>
</svg></label>
        <input type="file" id="fileInput" hidden accept=".html">
        <input type="text" id="fileName" value="index.html">
        <button onclick="downloadHtml()" class="btn-green"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="currentColor" class="bi bi-floppy" viewBox="0 0 16 16">
  <path d="M11 2H9v3h2z"/>
  <path d="M1.5 0h11.586a1.5 1.5 0 0 1 1.06.44l1.415 1.414A1.5 1.5 0 0 1 16 2.914V14.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 14.5v-13A1.5 1.5 0 0 1 1.5 0M1 1.5v13a.5.5 0 0 0 .5.5H2v-4.5A1.5 1.5 0 0 1 3.5 9h9a1.5 1.5 0 0 1 1.5 1.5V15h.5a.5.5 0 0 0 .5-.5V2.914a.5.5 0 0 0-.146-.353l-1.415-1.415A.5.5 0 0 0 13.086 1H13v4.5A1.5 1.5 0 0 1 11.5 7h-7A1.5 1.5 0 0 1 3 5.5V1H1.5a.5.5 0 0 0-.5.5m3 4a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5V1H4zM3 15h10v-4.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5z"/>
</svg></button>
    </div>
    <button onclick="toggleLayout('split')"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="currentColor" class="bi bi-arrows-expand-vertical" viewBox="0 0 16 16">
  <path d="M8 15a.5.5 0 0 1-.5-.5v-13a.5.5 0 0 1 1 0v13a.5.5 0 0 1-.5.5M.146 8.354a.5.5 0 0 1 0-.708l2-2a.5.5 0 1 1 .708.708L1.707 7.5H5.5a.5.5 0 0 1 0 1H1.707l1.147 1.146a.5.5 0 0 1-.708.708zM10 8a.5.5 0 0 1 .5-.5h3.793l-1.147-1.146a.5.5 0 0 1 .708-.708l2 2a.5.5 0 0 1 0 .708l-2 2a.5.5 0 0 1-.708-.708L14.293 8.5H10.5A.5.5 0 0 1 10 8"/>
</svg></button>
    <button onclick="toggleLayout('editor')"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="currentColor" class="bi bi-code-square" viewBox="0 0 16 16">
  <path d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
  <path d="M6.854 4.646a.5.5 0 0 1 0 .708L4.207 8l2.647 2.646a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 0 1 .708 0m2.292 0a.5.5 0 0 0 0 .708L11.793 8l-2.647 2.646a.5.5 0 0 0 .708.708l3-3a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708 0"/>
</svg></button>
    <button onclick="toggleLayout('preview')"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="currentColor" class="bi bi-browser-chrome" viewBox="0 0 16 16">
  <path fill-rule="evenodd" d="M16 8a8 8 0 0 1-7.022 7.94l1.902-7.098a3 3 0 0 0 .05-1.492A3 3 0 0 0 10.237 6h5.511A8 8 0 0 1 16 8M0 8a8 8 0 0 0 7.927 8l1.426-5.321a3 3 0 0 1-.723.255 3 3 0 0 1-1.743-.147 3 3 0 0 1-1.043-.7L.633 4.876A8 8 0 0 0 0 8m5.004-.167L1.108 3.936A8.003 8.003 0 0 1 15.418 5H8.066a3 3 0 0 0-1.252.243 2.99 2.99 0 0 0-1.81 2.59M8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4"/>
</svg></button>
    <button onclick="document.getElementById('helpModal').style.display='flex'" class="btn-pink"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
  <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
</svg></button>
</nav>

<main id="mainLayout">
    <section class="pane" id="editorPane">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(this, 'full')">FULL</button>
            <button class="tab-btn" onclick="switchTab(this, 'html')">HTML</button>
            <button class="tab-btn" onclick="switchTab(this, 'css')">CSS</button>
            <button class="tab-btn" onclick="switchTab(this, 'js')">JS</button>
            <button onclick="clearAll()" style="border:none; border-left:var(--border); box-shadow:none;">🗑</button>
        </div>
        <div class="editor-box">
            <textarea id="fullCode" spellcheck="false" placeholder="Kodlamaya başla..."></textarea>
            <textarea id="htmlCode" spellcheck="false" hidden placeholder="Body içeriği..."></textarea>
            <textarea id="cssCode" spellcheck="false" hidden placeholder="CSS Stilleri..."></textarea>
            <textarea id="jsCode" spellcheck="false" hidden placeholder="JS Kodları..."></textarea>
        </div>
    </section>

    <section class="pane">
        <iframe id="output"></iframe>
    </section>
</main>

<div id="helpModal">
    <div class="modal-header">
        <span>REFERANS</span>
        <button onclick="document.getElementById('helpModal').style.display='none'" style="color:white; border-color:white; background:transparent;">X</button>
    </div>
    <iframe src="https://bandanee.github.io/web-kodlama-ve-kisisel-gelisim/web-kodlama/referanslar/"></iframe>
</div>

<script>
    const $ = id => document.getElementById(id);
    const editors = {
        full: $('fullCode'),
        html: $('htmlCode'),
        css: $('cssCode'),
        js: $('jsCode')
    };
    const output = $('output');
    let isUpdating = false;

    // --- Core Logic ---
    function updatePreview() {
        if (isUpdating) return;
        isUpdating = true;
        const code = editors.full.value;
        output.srcdoc = code;
        syncToParts(code);
        isUpdating = false;
    }

    function updateFromParts() {
        if (isUpdating) return;
        isUpdating = true;
        const full = `<!DOCTYPE html>
<html>
<head>
    <style>${editors.css.value}<\/style>
</head>
<body>
    ${editors.html.value}
    <script>${editors.js.value}<\/script>
</body>
</html>`;
        editors.full.value = full;
        output.srcdoc = full;
        isUpdating = false;
    }

    function syncToParts(code) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(code, 'text/html');
        editors.html.value = doc.body.innerHTML.replace(/<script[\s\S]*?<\/script>/gi, "").trim();
        editors.css.value = Array.from(doc.querySelectorAll('style')).map(s => s.innerHTML).join("\n");
        editors.js.value = Array.from(doc.querySelectorAll('script:not([src])')).map(s => s.innerHTML).join("\n");
    }

    // --- Events ---
    editors.full.addEventListener('input', updatePreview);
    ['html', 'css', 'js'].forEach(key => {
        editors[key].addEventListener('input', updateFromParts);
    });

    // --- UI Functions ---
    function switchTab(btn, type) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        Object.values(editors).forEach(e => e.hidden = true);
        editors[type].hidden = false;
    }

    function toggleLayout(mode) {
        const main = $('mainLayout');
        main.parentElement.className = mode === 'split' ? '' : 'layout-' + mode;
    }

    function clearAll() {
        if (confirm('Temizle?')) {
            Object.values(editors).forEach(e => e.value = '');
            updatePreview();
        }
    }

    function downloadHtml() {
        const blob = new Blob([editors.full.value], {type: 'text/html'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = $('fileName').value || 'index.html';
        a.click();
    }

    $('fileInput').onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (ev) => {
            editors.full.value = ev.target.result;
            updatePreview();
            $('fileName').value = file.name;
        };
        reader.readAsText(file);
    };

    // Initial
    editors.full.value = ` `;
    updatePreview();
</script>

</body>
</html>
