<!-- Full HTML Modal -->

      </div>

        <button type="button" class="btn btn-primary" id="saveFullHtmlBtn">💾 Save</button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){

let currentHTML = '';
let lastLoadedHTML = '';

// Sidebar JSON
const curriculum = {
  categories: [
    {
      icon: '🚀',
      lessons: [
        {
          title: 'Lesson 1',
          code: ``
        },
        {
          title: 'Lesson 2',
          code: ``
        }
      ]
    }
  ]
};

// Sidebar
function renderSidebar(){
  const container = document.getElementById('sidebar');
  container.innerHTML='';
  curriculum.categories.forEach(cat=>{
    cat.lessons.forEach(lesson=>{
      const btn=document.createElement('button');
      btn.className='list-group-item list-group-item-action';
      btn.textContent=`${cat.icon} ${lesson.title}`;
      btn.addEventListener('click',()=>loadLesson(lesson,btn));
      container.appendChild(btn);
    });
  });
}

// Doc Search
document.getElementById('searchDoc').addEventListener('input',()=>{
  const filter=document.getElementById('searchDoc').value.toLowerCase();
  document.querySelectorAll('#sidebar .list-group-item').forEach(item=>{
    item.style.display=item.textContent.toLowerCase().includes(filter)?'block':'none';
    item.classList.remove('highlight');
    if(filter && item.textContent.toLowerCase().includes(filter)) item.classList.add('highlight');
  });
});

// Load lesson
function loadLesson(lesson, btn){
  document.querySelectorAll('#sidebar .list-group-item').forEach(i=>i.classList.remove('active'));
  if(btn) btn.classList.add('active');
  parseAndRenderHTML(lesson.code);
  lastLoadedHTML=lesson.code;
}

function parseAndRenderHTML(htmlString = '') {
    currentHTML = htmlString;

    document.getElementById('fullTextarea').value = htmlString;

    if (!htmlString.trim()) {
        ['headerTextarea', 'cssTextarea', 'htmlTextarea', 'jsTextarea', 'scriptTextarea', 'rich-editor'].forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            if (id === 'rich-editor') el.innerHTML = '';
            else el.value = '';
        });
        renderPreview();
        renderSemanticView();
        updateStructure();
        return;
    }

    try {
        const parser = new DOMParser();
        const doc = parser.parseFromString(currentHTML, 'text/html');

        document.getElementById('headerTextarea').value = Array.from(doc.head.querySelectorAll('meta,link')).map(e => e.outerHTML).join('\n');

        document.getElementById('cssTextarea').value = Array.from(doc.querySelectorAll('style')).map(s => s.innerHTML).join('\n');

        const bodyClone = doc.body.cloneNode(true);
        bodyClone.querySelectorAll('nav, .navbar').forEach(e => e.remove());
        bodyClone.querySelectorAll('script').forEach(s => s.remove());

        document.getElementById('htmlTextarea').value = bodyClone.innerHTML;
        document.getElementById('rich-editor').innerHTML = bodyClone.innerHTML;

        document.getElementById('jsTextarea').value = Array.from(doc.body.querySelectorAll('script:not([src])')).map(s => s.innerHTML).join('\n');

        document.getElementById('scriptTextarea').value = Array.from(doc.body.querySelectorAll('script[src]')).map(s => s.outerHTML).join('\n');

        renderPreview();
        renderSemanticView();
        updateStructure();
    } catch (e) {
        console.error('HTML parse error:', e);
        ['headerTextarea', 'cssTextarea', 'htmlTextarea', 'jsTextarea', 'scriptTextarea', 'rich-editor'].forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            if (id === 'rich-editor') el.innerHTML = '';
            else el.value = '';
        });
        renderPreview();
        renderSemanticView();
        updateStructure();
    }
}

// Semantic View
function renderSemanticView(){
  const parser=new DOMParser();
  const doc=parser.parseFromString(document.getElementById('htmlTextarea').value,'text/html');
  function wrapSemantic(el){
    const children=[];
    el.childNodes.forEach(c=>{
      if(c.nodeType===1){
        const wrapper=document.createElement('div');
        wrapper.innerHTML=`<strong>${c.tagName}</strong>`;
        wrapper.appendChild(wrapSemantic(c));
        children.push(wrapper);
      } else if(c.nodeType===3 && c.textContent.trim()){
        const textNode=document.createElement('div');
        textNode.textContent=c.textContent.trim();
        children.push(textNode);
      }
    });
    const container=document.createElement('div');
    children.forEach(ch=>container.appendChild(ch));
    return container;
  }
  const semanticContainer=document.getElementById('semanticView');
  semanticContainer.innerHTML='';
  semanticContainer.appendChild(wrapSemantic(doc.body));
}

function renderPreview(){
    const parser = new DOMParser();
    const doc = parser.parseFromString(document.getElementById('fullTextarea').value,'text/html');

    const styleTag = document.createElement('style');
    styleTag.innerHTML = document.getElementById('cssTextarea').value;
    doc.head.appendChild(styleTag);

    const previewBody = doc.body.cloneNode(true);
    previewBody.querySelectorAll('nav, .navbar').forEach(e => e.remove());
    previewBody.innerHTML = document.getElementById('htmlTextarea').value;

    doc.body.innerHTML = previewBody.innerHTML;

    const scriptInline = document.createElement('script');
    scriptInline.innerHTML = document.getElementById('jsTextarea').value;
    doc.body.appendChild(scriptInline);

    const tmp = document.createElement('div');
    tmp.innerHTML = document.getElementById('scriptTextarea').value;
    tmp.querySelectorAll('script[src]').forEach(s => doc.body.appendChild(s));

    const iframe = document.getElementById('previewIframe');
    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
    iframeDoc.open();
    iframeDoc.write('<!DOCTYPE html>\n' + doc.documentElement.outerHTML);
    iframeDoc.close();
}

// Rich Editor
function initRichEditor(){
  document.querySelectorAll('#richTab button[data-cmd]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.execCommand(btn.dataset.cmd,false,null);
      document.getElementById('htmlTextarea').value=document.getElementById('rich-editor').innerHTML;
      renderPreview();
      updateStructure();
      renderSemanticView();
    });
  });

  document.getElementById('rich-editor').addEventListener('input',()=>{
    document.getElementById('htmlTextarea').value=document.getElementById('rich-editor').innerHTML;
    renderPreview();
    updateStructure();
    renderSemanticView();
  });
}

// Textarea Sync
function initTextareaSync(){
  ['headerTextarea','cssTextarea','htmlTextarea','jsTextarea','scriptTextarea'].forEach(id=>{
    document.getElementById(id).addEventListener('input',()=>{
      if(id==='htmlTextarea'){ renderSemanticView(); }
      renderPreview();
      updateStructure();
    });
  });
}

// Structure
function updateStructure(){
  const container=document.getElementById('structureAccordion');
  container.innerHTML='';
  const htmlContent=document.getElementById('fullTextarea').value || '<!DOCTYPE html><html><head></head><body></body></html>';
  const parser=new DOMParser();
  const doc=parser.parseFromString(htmlContent,'text/html');
  const selfClosingTags=['area','base','br','col','embed','hr','img','input','link','meta','source','track','wbr','doctype'];

  const doctypeDiv=document.createElement('div');
  doctypeDiv.textContent='<!DOCTYPE html>';
  doctypeDiv.style.fontWeight='bold';
  container.appendChild(doctypeDiv);

  function createAccordion(node,level=0){
    const indent=level*20;
    if(node.nodeType===1){
      const tag=node.tagName.toLowerCase();
      const isSelfClosing=selfClosingTags.includes(tag);

      const wrapper=document.createElement('div');
      wrapper.style.marginLeft=indent+'px';
      wrapper.style.padding='2px 0';

      const title=document.createElement('div');
      title.style.cursor='pointer';
      title.style.userSelect='none';

      const emoji=document.createElement('span');
      emoji.textContent=isSelfClosing?' ':'▶';
      emoji.style.marginRight='6px';
      title.appendChild(emoji);

      const textNode=document.createElement('span');
      textNode.textContent=`<${tag}${node.attributes.length? ' '+Array.from(node.attributes).map(a=>`${a.name}="${a.value}"`).join(' '):''}${isSelfClosing?' /':''}>`;
      textNode.style.fontWeight='bold';
      title.appendChild(textNode);

      wrapper.appendChild(title);

      const childrenContainer=document.createElement('div');
      childrenContainer.style.display='none';
      childrenContainer.style.marginLeft='15px';
      wrapper.appendChild(childrenContainer);

      if(!isSelfClosing){
        title.addEventListener('click',()=>{
          const isOpen=childrenContainer.style.display==='block';
          childrenContainer.style.display=isOpen?'none':'block';
          emoji.textContent=isOpen?'▶':'▼';
        });

        node.childNodes.forEach(child=>{
          const childAcc=createAccordion(child,level+1);
          if(childAcc) childrenContainer.appendChild(childAcc);
        });

        const closeDiv=document.createElement('div');
        closeDiv.textContent=`</${tag}>`;
        closeDiv.style.marginLeft=indent+'px';
        childrenContainer.appendChild(closeDiv);
      }
      return wrapper;
    } else if(node.nodeType===3 && node.textContent.trim()){
      const textDiv=document.createElement('div');
      textDiv.textContent=node.textContent.trim();
      textDiv.style.marginLeft=indent+'px';
      return textDiv;
    }
    return null;
  }

  const rootAcc=createAccordion(doc.documentElement,0);
  if(rootAcc) container.appendChild(rootAcc);
}

// File Input
const fileInput=document.getElementById('htmlFileInput');
const reloadBtn=document.getElementById('reloadFileBtn');

fileInput.addEventListener('change',function(e){
  const file=e.target.files[0];
  if(file && file.type==='text/html'){
    reloadBtn.style.display='inline-block';
    const reader=new FileReader();
    reader.onload=function(evt){
      parseAndRenderHTML(evt.target.result);
      lastLoadedHTML=evt.target.result;
    };
    reader.readAsText(file);
  } else {
    reloadBtn.style.display='none';
    alert('Please select a valid HTML file.');
  }
});

reloadBtn.addEventListener('click',()=>{
  const file=fileInput?.files[0];
  if(file && file.type==='text/html'){
    const reader=new FileReader();
    reader.onload=function(evt){
      parseAndRenderHTML(evt.target.result);
      lastLoadedHTML=evt.target.result;
    };
    reader.readAsText(file);
  } else if(lastLoadedHTML){
    parseAndRenderHTML(lastLoadedHTML);
  } else {
    alert('No HTML to reload or valid file selected.');
  }
});

// Full Screen Toggle
let currentFullScreen = null;

window.toggleFullScreen = function(id){
  const left = document.getElementById('leftDiv');
  const center = document.getElementById('centerDiv');
  const right = document.getElementById('rightDiv');

  const allDivs = [left, center, right];

  if(currentFullScreen === id){
    left.style.display = 'flex';
    left.style.flex = '  0 0';
    center.style.display = 'flex';
    center.style.flex = '  0 50%';
    right.style.display = 'flex';
    right.style.flex = '  0 50%';
    currentFullScreen = null;
  } else {
    allDivs.forEach(d=>{
      if(d.id === id){
        d.style.display='flex';
        d.style.flex='1';
      } else {
        d.style.display='none';
      }
    });
    currentFullScreen = id;
  }

  setTimeout(()=>{
    ['htmlTextarea','cssTextarea','jsTextarea','scriptTextarea','headerTextarea','fullTextarea'].forEach(tid=>{
      const el = document.getElementById(tid);
      if(el) el.style.height = '100%';
    });

    const rich = document.getElementById('rich-editor');
    if(rich) rich.style.height = 'calc(100% - 50px)';

    const iframe = document.getElementById('previewIframe');
    if(iframe) iframe.style.height = '100%';
  },50);
};

// Full HTML Modal
window.openFullHtmlModal = function(){
  const modalTextarea=document.getElementById('modalFullHtmlTextarea');
  modalTextarea.value=document.getElementById('fullTextarea').value;
  const modal=new bootstrap.Modal(document.getElementById('fullHtmlModal'));
  modal.show();
}

document.getElementById('saveFullHtmlBtn').addEventListener('click',()=>{
  const updatedHtml=document.getElementById('modalFullHtmlTextarea').value;
  document.getElementById('fullTextarea').value = updatedHtml;
  parseAndRenderHTML(updatedHtml);

  const modalEl=document.getElementById('fullHtmlModal');
  const modal=bootstrap.Modal.getInstance(modalEl);
  modal.hide();

  ['htmlTextarea','cssTextarea','jsTextarea','scriptTextarea','headerTextarea','rich-editor'].forEach(id=>{
    const el=document.getElementById(id);
    if(el && id==='rich-editor'){
      el.innerHTML = document.getElementById('htmlTextarea').value;
    } else if(el){
      el.value = id==='htmlTextarea' ? document.getElementById('htmlTextarea').value :
                 id==='cssTextarea'  ? document.getElementById('cssTextarea').value  :
                 id==='jsTextarea'   ? document.getElementById('jsTextarea').value   :
                 id==='scriptTextarea'? document.getElementById('scriptTextarea').value :
                 id==='headerTextarea'? document.getElementById('headerTextarea').value : '';
    }
  });

  renderPreview();
  renderSemanticView();
  updateStructure();
});

// Font size
const fontSizeRange=document.getElementById('fontSizeRange');
const fontSizeValue=document.getElementById('fontSizeValue');
const textareas=[
  document.getElementById('headerTextarea'),
  document.getElementById('htmlTextarea'),
  document.getElementById('cssTextarea'),
  document.getElementById('jsTextarea'),
  document.getElementById('scriptTextarea')
];

fontSizeRange.addEventListener('input',()=>{
  const size=fontSizeRange.value+'px';
  fontSizeValue.textContent=size;
  textareas.forEach(ta=>ta.style.fontSize=size);
  document.getElementById('rich-editor').style.fontSize=size;
});

// Download HTML
document.getElementById('downloadHtmlBtn').addEventListener('click', () => {
  const htmlContent = document.getElementById('fullTextarea').value;
  const blob = new Blob([htmlContent], { type: 'text/html' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = 'index.html';
  a.click();

  URL.revokeObjectURL(url);
});

// Theme Toggle
document.body.classList.add('light-theme');

const toggleThemeBtn = document.getElementById('toggleThemeBtn');

toggleThemeBtn.addEventListener('click', () => {
  document.body.classList.toggle('dark-theme');
  document.body.classList.toggle('light-theme');

  const isDark = document.body.classList.contains('dark-theme');

  const navbar = document.querySelector('.navbar');
  navbar.classList.toggle('navbar-dark', isDark);
  navbar.classList.toggle('navbar-light', !isDark);
  navbar.classList.toggle('bg-dark', isDark);
  navbar.classList.toggle('bg-light', !isDark);

  const editorElems = [
    'headerTextarea','cssTextarea','htmlTextarea',
    'jsTextarea','scriptTextarea','fullTextarea','rich-editor'
  ];
  editorElems.forEach(id => {
    const el = document.getElementById(id);
    if(el){
      el.style.backgroundColor = getComputedStyle(document.body).getPropertyValue('--bg-element');
      el.style.color = getComputedStyle(document.body).getPropertyValue('--text-element');
      el.style.borderColor = getComputedStyle(document.body).getPropertyValue('--border-element');
    }
  });

  const iframe = document.getElementById('previewIframe');
  if(iframe.contentDocument){
    const doc = iframe.contentDocument;
    doc.body.style.backgroundColor = getComputedStyle(document.body).getPropertyValue('--bg-body');
    doc.body.style.color = getComputedStyle(document.body).getPropertyValue('--text-body');
    const elements = doc.querySelectorAll('div,h1,h2,h3,h4,h5,h6,p,li,ul,ol,.card,textarea');
    elements.forEach(el=>{
      el.style.backgroundColor = getComputedStyle(document.body).getPropertyValue('--bg-element');
      el.style.color = getComputedStyle(document.body).getPropertyValue('--text-element');
      el.style.borderColor = getComputedStyle(document.body).getPropertyValue('--border-element');
    });
  }
});

// Clear Full HTML
document.getElementById('clearFullHtmlBtn').addEventListener('click', () => {
    const modalTextarea = document.getElementById('modalFullHtmlTextarea');
    modalTextarea.value = '';

    const fullTextarea = document.getElementById('fullTextarea');
    fullTextarea.value = '';

    parseAndRenderHTML('');

    const editors = ['htmlTextarea','cssTextarea','jsTextarea','scriptTextarea','headerTextarea','rich-editor'];
    editors.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        if (id === 'rich-editor') el.innerHTML = '';
        else el.value = '';
    });

    renderPreview();
    renderSemanticView();
    updateStructure();
});

// Init
renderSidebar();
initRichEditor();
initTextareaSync();
loadLesson(curriculum.categories[0].lessons[0]);

});

console.log('%c⚡ HTML Editor - ', 'font-size: 24px; font-weight: bold; color: #00f0ff;');
console.log('%cBuilt with bold design & powerful features', 'font-size: 14px; color: #ffde59;');
</script>
